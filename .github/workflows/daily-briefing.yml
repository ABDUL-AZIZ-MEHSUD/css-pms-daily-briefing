
name: CSS PMS Daily Briefing

on:
  schedule:
    # Every day at 07:00 Pakistan Standard Time (UTC+5)
    - cron: "0 2 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-briefing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run CSS PMS briefing pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4o-mini
          MAX_ANALYSES: "1"
        run: |
          python scripts/update.py

      - name: Commit updated briefing data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/articles-inbox.json data/articles.json
          git diff --cached --quiet || git commit -m "Update daily CSS PMS briefing"
          git push
