<html lang="en"><head><meta charset="utf-8">

<title>CSS/PMS Daily Briefing</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f4ee;--card:#fff;--ink:#1c1c1a;--mut:#5a5f5c;--g:#01411C;--acc:#a06f14;--line:#ddd8c8;--chip:#e9dfc6}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#121512;--card:#1b201c;--ink:#ecebe4;--mut:#a5aba6;--g:#6fcf8f;--acc:#e0b04f;--line:#333a34;--chip:#2c3329}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#121512;--card:#1b201c;--ink:#ecebe4;--mut:#a5aba6;--g:#6fcf8f;--acc:#e0b04f;--line:#333a34;--chip:#2c3329}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 Georgia,'Times New Roman',serif}
.w{max-width:860px;margin:0 auto;padding:20px 16px 60px}
h1{font:700 26px/1.2 system-ui,Arial,sans-serif;color:var(--g);margin:0}
.sub{color:var(--mut);font:14px system-ui,Arial,sans-serif;margin:4px 0 14px}
.note{background:var(--chip);border-radius:8px;padding:10px 14px;font:13.5px/1.5 system-ui,Arial,sans-serif;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--g);border-radius:10px;margin-bottom:18px;padding:16px 18px}
.meta{font:12.5px system-ui,Arial,sans-serif;color:var(--mut);display:flex;flex-wrap:wrap;gap:8px}
.b{background:var(--chip);border-radius:4px;padding:1px 7px;font-weight:600}
.card h2{font:700 22px/1.3 system-ui,Arial,sans-serif;margin:8px 0}
.card h3{font:700 12.5px system-ui,Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--acc);margin:16px 0 4px;border-top:1px solid var(--line);padding-top:12px}
.card h4{font:700 15px system-ui,Arial,sans-serif;margin:10px 0 2px}
.card ul,.card ol{margin:2px 0;padding-left:22px}.card li{margin:4px 0}
.th{background:var(--chip);padding:10px 12px;border-radius:8px;margin:8px 0}
.q{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:8px 0}
.lnk{display:inline-block;margin-top:12px;font:600 14px system-ui,Arial,sans-serif;color:var(--g)}
a{color:var(--g)}.also li{font:14px system-ui,Arial,sans-serif}

<style>
.w{display:none}
:root{--ui:'Inter',system-ui,Arial,sans-serif;--rd:'Source Serif 4',Georgia,serif;--sh:0 2px 10px rgba(0,0,0,.07)}
body{font-family:var(--ui)}
#app{min-height:100vh}
.top{background:linear-gradient(135deg,#01411C,#0b6b34);color:#fff;padding:18px 16px 14px}
.top .in{max-width:1100px;margin:0 auto}
.top h1{font:700 24px/1.2 var(--ui);color:#fff;margin:0}
.top p{margin:2px 0 12px;opacity:.85;font-size:13.5px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar input{flex:1;min-width:180px;padding:9px 12px;border-radius:8px;border:0;font:14px var(--ui)}
.nb{border:0;border-radius:8px;padding:8px 13px;font:600 13px var(--ui);cursor:pointer;background:rgba(255,255,255,.16);color:#fff}
.nb.on{background:#fff;color:#01411C}
.main{max-width:1100px;margin:0 auto;padding:18px 16px 70px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.st{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;box-shadow:var(--sh)}
.st b{display:block;font-size:22px;color:var(--g)}.st span{font-size:12px;color:var(--mut)}
.fl{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0}
.fl button{font:600 12.5px var(--ui);border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:18px;padding:5px 12px;cursor:pointer}
.fl button.on{background:var(--g);color:var(--bg);border-color:var(--g)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px;margin-top:10px}
.ac{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:8px;position:relative}
.ac h3{font:700 18px/1.3 var(--ui);margin:0;padding-right:30px}
.ac p{margin:0;font:14px/1.55 var(--rd);color:var(--mut)}
.pp{font:700 11px var(--ui);letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:4px;color:#fff;display:inline-block}
.tg{font:12px var(--ui);color:var(--mut)}
.star{position:absolute;right:12px;top:10px;background:none;border:0;font-size:22px;cursor:pointer;color:var(--acc)}
.rb{margin-top:auto;border:0;background:var(--g);color:var(--bg);border-radius:8px;padding:8px;font:600 13px var(--ui);cursor:pointer}
.pill{font:600 11px var(--ui);padding:2px 8px;border-radius:10px;background:var(--chip)}
.pane{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:var(--sh);margin-top:12px}
.pane h2{font:700 20px var(--ui);margin:0 0 8px;color:var(--g)}.pane p,.pane li{font:15px/1.6 var(--rd)}
.pane textarea{width:100%;min-height:190px;border:1px solid var(--line);border-radius:8px;padding:10px;font:14px/1.5 var(--rd);background:var(--bg);color:var(--ink)}
.pane table{width:100%;border-collapse:collapse;font:14px var(--ui)}.pane td,.pane th{border-bottom:1px solid var(--line);padding:8px;text-align:left}
.rd{position:fixed;inset:0;background:var(--bg);overflow:auto;z-index:50;padding-top:env(safe-area-inset-top,0px)}
.rd .pg{position:sticky;top:0;height:4px;background:var(--line);z-index:3}.rd .pg i{display:block;height:4px;width:0;background:var(--acc)}
.tb{position:sticky;top:4px;z-index:3;background:var(--card);border-bottom:1px solid var(--line);padding:8px 12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tb button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:6px 10px;font:600 12.5px var(--ui);cursor:pointer}
.rw{display:flex;gap:28px;max-width:1040px;margin:0 auto;padding:18px 16px 90px}
.toc{width:190px;flex:none;position:sticky;top:64px;align-self:flex-start;font:13px/1.9 var(--ui)}
.toc a{display:block;color:var(--mut);text-decoration:none;border-left:2px solid var(--line);padding-left:10px}.toc a:hover{color:var(--g);border-color:var(--g)}
@media(max-width:820px){.toc{display:none}}
.art{flex:1;min-width:0;max-width:720px;font-family:var(--rd);line-height:1.8}
.art h1{font:700 30px/1.25 var(--ui);margin:6px 0 10px}
.art h2{font:700 13px var(--ui);letter-spacing:.07em;text-transform:uppercase;color:var(--acc);margin:30px 0 6px;border-top:2px solid var(--line);padding-top:14px}
.art h3{font:700 16px var(--ui);margin:16px 0 2px}
.art p,.art li{margin:6px 0}
.hl{border-left:4px solid var(--acc);background:var(--chip);padding:10px 14px;border-radius:0 8px 8px 0;font-style:italic}
.fact{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 14px}
.qa{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:10px 0}
.terms{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px;padding:0;list-style:none}
.terms li{background:var(--chip);border-radius:8px;padding:8px 10px;font:14px/1.45 var(--ui);margin:0}
.art textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:8px;padding:10px;font:15px/1.5 var(--rd);background:var(--card);color:var(--ink)}
:root[data-theme="sepia"]{--bg:#f4ecd8;--card:#fbf5e4;--ink:#3b2f1e;--mut:#6d5c43;--line:#dccfae;--chip:#eadfbf}
@media print{.top,.tb,.toc,.pg{display:none}.rd{position:static}}

/* Redesigned CSS/PMS study sections */
.art .fact{margin:10px 0 18px;padding:12px 18px}
.art .fact ul{padding-left:22px}
.art .fact li{margin:9px 0;line-height:1.65}
.art .qa{padding:14px 17px;margin:13px 0}
.art .qa p{line-height:1.7}
.art .qa small{display:block;color:var(--mut);font:12px var(--ui);margin-top:8px}
.art .quiz{margin:12px 0 24px}
.art .mcq-option{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;margin:7px 0;border:1px solid var(--line);border-radius:8px;background:var(--bg);font:14px/1.5 var(--ui);cursor:pointer}
.art .mcq-option:hover{border-color:var(--acc)}
.art .mcq-option input{margin-top:4px;accent-color:var(--g);flex:none}
.art .mcq-option input:disabled{cursor:not-allowed}
.art .quiz-explanation{padding:9px 12px;border-left:3px solid var(--acc);background:var(--chip);border-radius:4px;font:14px/1.6 var(--ui)}
.art .quiz-result{font:700 20px var(--ui);margin:18px 0}
.art .quiz button{border:0;background:var(--g);color:#fff;border-radius:8px;padding:10px 18px;font:600 14px var(--ui);cursor:pointer}
.art .quiz button:hover{filter:brightness(1.12)}
.art #quiz-msg{color:#b45309;font:13px var(--ui)}
.art ol[type="i"]{padding-left:30px;margin:3px 0 14px}
.art ol[type="i"] li{padding-left:5px;margin:4px 0}
.art h3{line-height:1.45}
@media(max-width:600px){
 .rw{padding:12px 12px 70px}
 .art h1{font-size:25px}
 .art .mcq-option{padding:11px 9px}
 .tb{gap:5px;padding:7px}
 .tb button{padding:7px 8px;font-size:12px}
}


/* PREMIUM ACADEMIC THEME */
:root {
  --bg: #f7f5ef;
  --card: #ffffff;
  --ink: #243247;
  --mut: #687487;
  --g: #142b49;
  --acc: #b89552;
  --line: #e5e0d5;
  --chip: #f0eadc;
  --sh: 0 5px 20px rgba(20,43,73,.055);
}
body { background:var(--bg); color:var(--ink); }
.top {
  background:linear-gradient(125deg,#10233d,#1b3b60) !important;
  border-bottom:3px solid #b89552;
  border-radius:0 0 16px 16px;
  box-shadow:0 8px 24px rgba(16,35,61,.13);
  padding:25px 20px 20px;
}
.top h1 { letter-spacing:-.5px; }
.top p { color:#e4e8ee; }
.bar input {
  min-height:42px;
  border:1px solid #d8dce2;
  border-radius:9px;
}
.nb { transition:all .18s ease; }
.nb.on { background:#b89552 !important; color:#142b49 !important; }
.main { max-width:1200px; padding-top:25px; }
.st,.ac,.pane {
  border:1px solid var(--line);
  border-radius:13px;
  box-shadow:var(--sh);
}
.st { padding:15px 17px; }
.st b { color:#142b49; }
.ac {
  padding:19px;
  transition:transform .18s ease,box-shadow .18s ease;
}
.ac:hover {
  transform:translateY(-2px);
  box-shadow:0 9px 25px rgba(20,43,73,.09);
  border-color:#c9b88f;
}
.ac h3 { color:#142b49; }
.pp { background:#142b49; }
.star { color:#b89552; }
.rb,.quiz button {
  background:#142b49 !important;
  color:#fff !important;
  border-radius:8px;
}
.rb:hover,.quiz button:hover { background:#203f64 !important; }
.fl button.on {
  background:#142b49;
  border-color:#142b49;
  color:#fff;
}
.pane h2 { color:#142b49; }
.rd { background:var(--bg); }
.tb {
  background:#fff;
  border-bottom:2px solid #b89552;
  box-shadow:0 3px 12px rgba(20,43,73,.05);
}
.tb button { border-radius:7px; }
.art h1 { color:#142b49; }
.art h2 { color:#9b783c; border-color:#d8c69f; }
.art h3 { color:#243b59; }
.hl { background:#f1eadb; border-color:#b89552; }
.fact,.qa { border-color:#e5dfd1; box-shadow:0 3px 12px rgba(20,43,73,.035); }
.terms li { background:#f0eadc; }
:root[data-theme="sepia"] {
  --bg:#f4ecd8; --card:#fbf5e4; --ink:#3b2f1e;
  --mut:#6d5c43; --line:#dccfae; --chip:#eadfbf;
}
:root[data-theme="dark"] {
  --bg:#121a26; --card:#1c2939; --ink:#e9edf3;
  --mut:#aab5c3; --g:#d1ad68; --acc:#d1ad68;
  --line:#344255; --chip:#29384a;
}
.sub-card{margin:0 0 14px;border-left:4px solid var(--g)}
.sub-card.warning{border-left-color:#c28b28}
.sub-details{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.sub-details span{display:block;font:12px var(--ui);color:var(--mut);margin-bottom:4px}
.sub-details b{font:600 14px var(--ui);color:var(--ink)}
.sub-reminder{display:inline-block;margin:0 0 10px;padding:7px 11px;border:1px solid rgba(255,255,255,.28);border-radius:8px;background:rgba(255,255,255,.10);font:13px var(--ui);color:#fff}
.sub-reminder.warning{background:rgba(194,139,40,.22);border-color:#d8b66f}
.sub-card.warning h2{color:#c28b28}
@media(max-width:600px) {
  .top { border-radius:0 0 12px 12px; padding:20px 14px; }
  .main { padding:15px 12px 60px; }
  .grid { grid-template-columns:1fr; }
}

<script>
loadArticlesFromFirestore().then(function(D){
SUBSCRIPTION=D.subscription||null;
var STUDENT_UID=D.uid||"";
var CLOUD_PROGRESS=D.progress||{};
var raw=Array.isArray(D)?D:(D.articles||[]);
function arr(x){return Array.isArray(x)?x:[]}
function group(title,items){return items.length?[title,items]:null}
A=raw.filter(function(r){
 return r.analysis_status==="completed"&&r.analysis;
}).map(function(r){
 var x=r.analysis,es=x.essay_outline||{},ar=x.argument_structure||{},ca=x.critical_analysis||{},pk=x.pakistan_relevance||{};

 return {
 id:r.id||r.article_id||r.url||((r.source||"Unknown")+"|"+(r.title||"Untitled")),
 p:r.source||"Unknown",
 t:r.title||"Untitled",
 d:r.published||"",
 u:r.url||"",
 tag:arr(x.css_pms_subjects).join(" | "),
 thesis:x.central_thesis||"",
 precis:x.precis||x.executive_summary||"",
 struct:arr(ar.main_arguments),
 ctx:arr(pk.connections).concat(arr(pk.challenges),arr(x.international_context)),

 an:[
 group("Supporting arguments",arr(ar.supporting_arguments)),
 group("Counterarguments",arr(ar.counterarguments)),
 group("Underlying assumptions",arr(ar.underlying_assumptions)),
 group("Strengths",arr(ca.strengths)),
 group("Weaknesses",arr(ca.weaknesses)),
 group("Critical observations",arr(ca.critical_observations)),
 group("Balanced assessment",ca.balanced_assessment?[ca.balanced_assessment]:[]),
 group("Policy recommendations",arr(pk.policy_recommendations)),
 group("Revision points",arr(x.revision_points))
 ].filter(Boolean),

 terms:arr(x.important_terminology).map(function(t){
  return typeof t==="string"?t:(t.term||"")+" | "+(t.definition||"");
 }),

 studyTerms:arr(x.important_terminology).map(function(t){
  if(typeof t==="string")return {term:t,definition:"",usage_example:""};
  return {term:t.term||"",definition:t.definition||"",usage_example:t.usage_example||""};
 }),

 studyFacts:arr(x.facts_to_memorise).map(function(f){
  if(typeof f==="string")return {category:"Fact",content:f,attribution:"",context:""};
  return {
   category:f.category||"Fact",
   content:f.content||"",
   attribution:f.attribution||"",
   context:f.context||""
  };
 }),

 facts:arr(x.facts_to_memorise).map(function(f){
  if(typeof f==="string")return f;
  return [
   f.category||"Fact",
   f.content||"",
   f.attribution?"Attribution: "+f.attribution:"",
   f.context?"Context: "+f.context:""
  ].filter(Boolean).join(" | ");
 }),

 verification:arr(x.facts_requiring_verification).map(function(f){
  if(typeof f==="string")return f;
  return [
   f.claim||"Unspecified claim",
   "Claim type: "+(f.claim_type||"Not specified"),
   "Why verification is needed: "+(f.why_verification_is_needed||"Not specified"),
   "Recommended source: "+(f.recommended_source||"Not specified")
  ].join("\n");
 }),

 ex:arr(x.possible_exam_questions).map(function(q){
  return [
   q.question||"",
   q.model_answer||q.answer||"Model answer not available in this older analysis.",
   q.type||"Analytical"
  ];
 }),

 intro:x.model_introduction||es.introduction||"",
 essayTitle:es.title||"",
 essayThesis:es.thesis_statement||"",
 essay:arr(es.main_headings).map(function(h,i){
  if(typeof h==="string"){
   return {heading:(i+1)+". "+h,subheadings:[]};
  }
  return {
   heading:h.heading||((i+1)+". Untitled heading"),
   subheadings:arr(h.subheadings)
  };
 }),


mcqs: arr(x.mcqs||r.mcqs).slice(0,5).map(function(q){
  return {
    question: q.question || "",
    options: arr(q.options).slice(0,4),
    correct_option:
      Number.isInteger(q.correct_option) &&
      q.correct_option >= 0 &&
      q.correct_option <= 3
        ? q.correct_option
        : -1,
    explanation: q.explanation || ""
  };
})
};
});

// Deliver authorised study material and the student's cloud progress to Android.
// Only study notes, facts, terminology, MCQs and source links are included; no full article text.
window.cssPmsSendNativeStudyData=function(studyProgress){
 try{
  if(window.StudyNative&&SUBSCRIPTION&&SUBSCRIPTION.status==="active"){
   var nativeArticles=A.map(function(a){
    return {
     id:a.id,source:a.p,title:a.t,published:a.d,url:a.u,
     thesis:a.thesis,precis:a.precis,
     studyTerms:a.studyTerms||[],studyFacts:a.studyFacts||[],mcqs:a.mcqs||[]
    };
   });
   window.StudyNative.postMessage(JSON.stringify({
    type:"authorizedStudyData",uid:STUDENT_UID,subscription:SUBSCRIPTION,
    articles:nativeArticles,studyProgress:studyProgress||{devices:{}}
   }));
  }
 }catch(nativeSyncError){console.warn("Android study sync unavailable:",nativeSyncError);}
};
window.cssPmsSendNativeStudyData(CLOUD_PROGRESS.studyCentre||{devices:{}});

var ST={saved:{},status:{},notes:{},mcqAnswers:{},mcqSubmitted:{},
 flashcardReviewed:{},flashcardRevealed:{},vocabularyReviewed:{},
 studyStats:null,mine:[],fs:18,theme:"auto",__progressMeta:{}};
var DASHBOARD_STORAGE_KEY="cssdash_user_"+STUDENT_UID;
try{
 var storedOwner=localStorage.getItem("cssdash_owner_uid")||"";
 var storedState=localStorage.getItem(DASHBOARD_STORAGE_KEY);
 if(!storedState&&(!storedOwner||storedOwner===STUDENT_UID))storedState=localStorage.getItem("cssdash");
 var o=JSON.parse(storedState||"{}");for(var k in o)ST[k]=o[k];
}catch(e){}
["saved","status","notes","mcqAnswers","mcqSubmitted","flashcardReviewed","flashcardRevealed","vocabularyReviewed","__progressMeta"].forEach(function(field){if(!ST[field]||typeof ST[field]!=="object"||Array.isArray(ST[field]))ST[field]={}});
if(!Array.isArray(ST.mine))ST.mine=[];
var PROGRESS_FIELDS=["saved","status","notes","mcqAnswers","mcqSubmitted","flashcardReviewed","vocabularyReviewed"];
ST.__progressMeta=ST.__progressMeta||{};
function mergeCloudDashboardProgress(){
 var cloud=(CLOUD_PROGRESS.dashboard&&CLOUD_PROGRESS.dashboard.fields)||{};
 PROGRESS_FIELDS.forEach(function(field){
  var items=cloud[field]||{};ST[field]=ST[field]||{};ST.__progressMeta[field]=ST.__progressMeta[field]||{};
  Object.keys(items).forEach(function(key){
   var entry=items[key];if(!entry||!Object.prototype.hasOwnProperty.call(entry,"value"))return;
   var cloudTime=Number(entry.updatedAt)||0;
   var localTime=Number(ST.__progressMeta[field][key])||0;
   if(!Object.prototype.hasOwnProperty.call(ST[field],key)||cloudTime>localTime){
    ST[field][key]=entry.value;ST.__progressMeta[field][key]=cloudTime;
   }
  });
 });
}
mergeCloudDashboardProgress();
var legacyProgressChanges={};
PROGRESS_FIELDS.forEach(function(field){
 var local=ST[field]||{},cloud=((CLOUD_PROGRESS.dashboard&&CLOUD_PROGRESS.dashboard.fields)||{})[field]||{};
 Object.keys(local).forEach(function(key){
  var localStamp=Number((ST.__progressMeta[field]||{})[key])||0;
  var cloudStamp=cloud[key]?(Number(cloud[key].updatedAt)||0):0;

      return {
        question: q.question || "",
        options: arr(q.options).slice(0,4),
        correct_option:
          Number.isInteger(q.correct_option) &&
          q.correct_option >= 0 &&
          q.correct_option <= 3
            ? q.correct_option
            : -1,
        explanation: q.explanation || ""
      };
    })
   };

   // Validate all five MCQs before saving the article
   if (r.mcqs.length !== 5 || r.mcqs.some(function(q){
     return q.options.length !== 4 ||
            q.correct_option < 0 ||
            q.correct_option > 3 ||
            new Set(q.options).size !== 4;
   })) {
     $("gs").textContent = "Invalid MCQ data. Please generate again.";
     return;
   }

   // Save the completed article
   ST.mine.push(r);
   sv();
   S.v = "today";
   S.o = r;
   render();
  });
 }).catch(function(err){
  console.error("Generation error:",err);
  $("gs").textContent =
    "Could not generate notes (" +
    (err && err.code || "error") +
    "). Try again later.";
 });
}

render();

}).catch(function(e){
 console.error("Article loading error:",e);
 try{
  var failedUid=window.firebase&&firebase.auth&&firebase.auth().currentUser?firebase.auth().currentUser.uid:"";
  if(window.StudyNative)window.StudyNative.postMessage(JSON.stringify({type:"studySyncFailed",uid:failedUid}));
 }catch(ignoreBridge){}
 var app=document.getElementById("app"),cache=null;
 try{cache=JSON.parse(localStorage.getItem("cssdash_offline_cache")||"null")}catch(ignore){}
 function safe(x){return String(x||"").replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
 var expiry=cache&&cache.expiry?new Date(cache.expiry):null;
 var signedInUid="";
 try{signedInUid=window.firebase&&firebase.auth&&firebase.auth().currentUser?firebase.auth().currentUser.uid:""}catch(ignoreAuth){}
 var valid=!!(cache&&cache.uid&&signedInUid===cache.uid&&expiry&&!isNaN(expiry.getTime())&&expiry.getTime()>Date.now()&&Array.isArray(cache.articles));
 if(valid){
  var rows=cache.articles.map(function(a){
   var terms=(a.studyTerms||[]).map(function(t){return "<li><b>"+safe(t.term)+"</b>: "+safe(t.definition)+"</li>"}).join("");
   var facts=(a.studyFacts||[]).map(function(f){return "<li>"+safe(typeof f==="string"?f:(f.content||""))+(f.attribution?" — "+safe(f.attribution):"")+"</li>"}).join("");
   return "<article style='padding:18px;margin:14px 0;background:white;border:1px solid #e4eaf1;border-radius:12px'>"+
    "<small>"+safe(a.source)+" · "+safe(a.published)+"</small><h2>"+safe(a.title)+"</h2>"+
    "<h3>Central thesis</h3><p>"+safe(a.thesis)+"</p><h3>Precis</h3><p>"+safe(a.precis)+"</p>"+
    (facts?"<h3>Facts to memorise</h3><ul>"+facts+"</ul>":"")+
    (terms?"<h3>Vocabulary</h3><ul>"+terms+"</ul>":"")+
    (a.url?"<p><a href='"+safe(a.url)+"' target='_blank' rel='noopener'>Open original newspaper article</a></p>":"")+"</article>";
  }).join("");
  app.innerHTML="<main style='max-width:900px;margin:auto;padding:24px;font-family:Arial;color:#263548;background:#f3f6fa;min-height:100vh'>"+
   "<h1 style='color:#173b63'>CSS/PMS Daily Briefing — Offline Study Mode</h1>"+
   "<p>Showing locally cached study notes. Subscription cache expiry: <b>"+safe(expiry.toLocaleString())+"</b>. Reconnect and sign in to refresh and synchronise progress.</p>"+rows+"</main>";
 }else{
  app.innerHTML='<div style="padding:25px;font-family:Arial"><h2>Unable to load articles</h2><p>No valid offline study cache is available. Connect to the internet and sign in with an active subscription.</p><p>Error: '+safe(e.message||e)+'</p></div>';
 }
});
</script>
